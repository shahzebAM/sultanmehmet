<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultan Mehmet Urdu Sub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --side: #161b2a;
            --acc: #38bdf8;
            --txt: #f8fafc;
            --txt-dim: #94a3b8;
            --header-h: 60px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--txt);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* Header Styling */
        header {
            height: var(--header-h);
            background: rgba(22, 27, 42, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            border-bottom: 1px solid #2d3e50;
            z-index: 100;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--acc);
            text-transform: uppercase;
        }

        /* Main Layout */
        main {
            display: flex;
            flex: 1;
            height: calc(100vh - var(--header-h));
            overflow: hidden;
        }

        /* Player Section */
        .player-area {
            flex: 3;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-details h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        /* Sidebar Section */
        .sidebar {
            flex: 1;
            max-width: 400px;
            background: var(--side);
            border-left: 1px solid #2d3e50;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1.2rem;
            font-weight: 600;
            border-bottom: 1px solid #2d3e50;
            font-size: 0.9rem;
            color: var(--txt-dim);
            text-transform: uppercase;
        }

        #list {
            flex: 1;
            overflow-y: auto;
        }

        /* Episode Item Styling */
        .ep-item {
            padding: 1rem 1.2rem;
            cursor: pointer;
            border-bottom: 1px solid #1e293b;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
        }

        .ep-item:hover {
            background: #232d42;
        }

        .ep-item.active {
            background: #2d3e50;
            border-left: 4px solid var(--acc);
            color: var(--acc);
        }

        .ep-item::before {
            content: "▶";
            font-size: 0.7rem;
            opacity: 0.5;
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* RESPONSIVE DESIGN */
        @media (max-width: 1024px) {
            .player-area { flex: 2; }
        }

        @media (max-width: 768px) {
            body { overflow: auto; } /* Allow main body to scroll on mobile */
            main {
                flex-direction: column;
                height: auto;
                overflow: visible;
            }
            .player-area {
                padding: 10px;
                flex: none;
            }
            .sidebar {
                max-width: 100%;
                border-left: none;
                border-top: 1px solid #2d3e50;
                height: 500px; /* Fixed height for list on mobile */
            }
            .video-details h2 { font-size: 1.2rem; }
        }

        @media (max-width: 480px) {
            header { padding: 0 1rem; }
            header h1 { font-size: 0.9rem; }
            .sidebar { height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>SULTAN MEHMET URDU SUB</h1>
    </header>

    <main>
        <section class="player-area">
            <div class="video-container">
                <iframe id="video-player" allowfullscreen></iframe>
            </div>
            <div class="video-details">
                <h2 id="video-title">Select an Episode</h2>
            </div>
        </section>

        <section class="sidebar">
            <div class="sidebar-header">Episode List</div>
            <div id="list"></div>
        </section>
    </main>

    <script>
        async function init() {
            try {
                const res = await fetch('./episodes.json');
                const data = await res.json();
                const list = document.getElementById('list');
                const player = document.getElementById('video-player');
                const title = document.getElementById('video-title');

                data.forEach((ep, i) => {
                    const div = document.createElement('div');
                    div.className = 'ep-item';
                    div.innerHTML = `<span>${ep.name}</span>`;
                    
                    div.onclick = () => {
                        player.src = ep.url;
                        title.innerText = ep.name;
                        
                        // Update active state UI
                        document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
                        div.classList.add('active');

                        // Scroll video into view on mobile when clicking an episode
                        if (window.innerWidth <= 768) {
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    };
                    
                    list.appendChild(div);
                    if(i === 0) div.click(); // Load first ep automatically
                });
            } catch (err) {
                console.error("Failed to load episodes. Make sure episodes.json exists.", err);
            }
        }
        init();
    </script>
</body>
</html>
