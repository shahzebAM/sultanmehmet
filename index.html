<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --side: #1e293b; --acc: #38bdf8; --txt: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--txt); margin: 0; display: flex; height: 100vh; flex-direction: column; overflow: hidden; }
        header { padding: 1rem 2rem; border-bottom: 1px solid #334155; }
        main { display: flex; flex: 1; overflow: hidden; }
        .player { flex: 3; padding: 20px; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .sidebar { flex: 1; background: var(--side); border-left: 1px solid #334155; overflow-y: auto; }
        .ep-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #334155; transition: 0.2s; }
        .ep-item:hover { background: #334155; }
        .ep-item.active { border-left: 4px solid var(--acc); background: #2d3e50; }
        @media (max-width: 800px) { main { flex-direction: column; overflow-y: auto; } .sidebar { height: 300px; } }
    </style>
</head>
<body>
    <header><h1>STREAMVERSE</h1></header>
    <main>
        <section class="player">
            <div class="video-box"><iframe id="video-player" allowfullscreen></iframe></div>
            <h2 id="video-title">Loading...</h2>
        </section>
        <section class="sidebar" id="list"></section>
    </main>

    <script>
        async function init() {
            const res = await fetch('./episodes.json');
            const data = await res.json();
            const list = document.getElementById('list');
            const player = document.getElementById('video-player');
            const title = document.getElementById('video-title');

            data.forEach((ep, i) => {
                const div = document.createElement('div');
                div.className = 'ep-item';
                div.innerHTML = `Episode ${i+1}: ${ep.name}`;
                div.onclick = () => {
                    player.src = ep.url;
                    title.innerText = ep.name;
                    document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                };
                list.appendChild(div);
                if(i === 0) div.click(); // Load first ep
            });
        }
        init();
    </script>
</body>
</html>
